<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 212" width="880" height="212" role="img" aria-label="Get in touch with Hoodgail Benjamin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Get in touch with Hoodgail Benjamin</title><defs><style>@font-face{font-family:'Bebas';src:url(data:font/woff2;base64,) format('woff2');font-display:block}@font-face{font-family:'Cour';src:url(data:font/woff2;base64,) format('woff2');font-display:block}text{white-space:pre}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.snip{animation:snip 14s linear infinite}@keyframes snip{from{transform:translateX(0)}to{transform:translateX(840px)}}.in{animation:in .6s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(10px)}}</style><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="d"/><feComponentTransfer in="d"><feFuncA type="discrete" tableValues="0 0 0 .06 .1 .14 0 0"/></feComponentTransfer></filter><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.15" numOctaves="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter><pattern id="halftone" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.05" fill="#15120D"/><circle cx="3.7" cy="3.7" r="1.05" fill="#15120D"/></pattern></defs><rect width="880" height="212" fill="#E7E1D1"/><line x1="0" y1="18" x2="880" y2="18" stroke="#15120D" stroke-width="1.2" opacity=".55" stroke-dasharray="6 5"/><g class="snip"><g transform="translate(20 18)"><g stroke="#15120D" stroke-width="1.5" fill="none" stroke-linecap="round"><circle cx="-7" cy="-5" r="3.2"/><circle cx="-7" cy="5" r="3.2"/><path d="M-4.4 -3.6 L9 4"/