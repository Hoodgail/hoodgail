<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" role="img" aria-labelledby="title desc">
<title id="title">three-query-selector</title><desc id="desc">CSS-like selector syntax for Three.js scene graphs.</desc>
<rect width="580" height="310" fill="#e94f2f"/>
<rect x="12" y="12" width="556" height="286" fill="#f4efe5" stroke="#111"/>
<text x="32" y="42" font-family="Courier New,monospace" font-size="12" fill="#111">LIBRARY / 04</text>
<text x="548" y="42" text-anchor="end" font-family="Courier New,monospace" font-size="12" fill="#e94f2f">5★ ↗</text>
<text x="32" y="99" font-family="Impact,Arial Narrow,sans-serif" font-size="38" fill="#111">THREE-QUERY-SELECTOR</text>
<text x="34" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111">CSS-LIKE QUERIES FOR THREE.JS OBJECTS</text>
<line x1="32" y1="164" x2="548" y2="164" stroke="#111"/>
<text x="32" y="194" font-family="Courier New,monospace" font-size="13" fill="#111">GROUP &gt; MESH[NAME=CUBE] • DESCENDANTS • FILTERS</text>
<text x="32" y="220" font-family="Courier New,monospace" font-size="13" fill="#111">TYPESCRIPT / THREE.JS / SCENE-GRAPH TOOLING</text>
<g transform="translate(430 242)">
 <rect width="118" height="28" fill="#111"/>
 <text x="8" y="19" font-family="Courier New,monospace" font-size="12" fill="#f4efe5">[name=cube]</text>
 <rect x="104" y="7" width="7" height="14" fill="#e94f2f"><animate attributeName="opacity" values="1;.2;1" dur=".9s" repeatCount="indefinite"/></rect>
</g>
<text x="32" y="276" font-family="Comic Sans MS,cursive" font-size="16" fill="#e94f2f" transform="rotate(-3 32 276)">DOM ergonomics, but the nodes are meshes.</text>
</svg>
