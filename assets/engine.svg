<text x="46" y="166" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4efe5">RENDERING • NETWORKING • TOOLS • PHYSICS • PIPELINES</text>
<text x="46" y="212" font-family="Courier New,monospace" font-size="13" fill="#f4efe5">I LIKE THE LAYER BELOW “APP DEVELOPMENT.”</text>
<text x="46" y="238" font-family="Courier New,monospace" font-size="13" fill="#f4efe5">THE PART WHERE THE ENGINE, PROTOCOL, OR EDITOR DOESN’T EXIST YET.</text>
<text x="46" y="287" font-family="Comic Sans MS,cursive" font-size="18" fill="#e94f2f" transform="rotate(-2 46 287)">yes, I will profile the frame time.</text>
