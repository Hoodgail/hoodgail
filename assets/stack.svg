<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Technical arsenal</title><desc id="desc">Languages, graphics, frontend, backend, data, infrastructure and specialist skills.</desc>
<rect width="1200" height="430" fill="#f4efe5"/>
<text x="42" y="68" font-family="Impact,Arial Narrow,sans-serif" font-size="54" fill="#111">TECHNICAL ARSENAL</text>
<text x="1158" y="65" text-anchor="end" font-family="Courier New,monospace" font-size="14" fill="#111">( the full stack, including the weird parts )</text>
<line x1="42" y1="92" x2="1158" y2="92" stroke="#111"/>
<g font-family="Courier New,monospace" fill="#111">
  <g transform="translate(42 132)">
    <text font-size="12" fill="#e94f2f">01 / LANGUAGES</text><text y="37" font-size="15" font-weight="700">TypeScript / JavaScript</text><text y="64" font-size="15">Python</text><text y="91" font-size="15">GLSL / SQL</text>
  </g>
  <g transform="translate(272 132)">
    <text font-size="12" fill="#e94f2f">02 / GRAPHICS</text><text y="37" font-size="15" font-weight="700">Three.js / WebGL</text><text y="64" font-size="15">WebGPU / TSL</text><text y="91" font-size="15">PixiJS / BabylonJS</text>
  </g>
  <g transform="translate(496 132)">
    <text font-size="12" fill="#e94f2f">03 / FRONTEND</text><text y="37" font-size="15" font-weight="700">SvelteKit / React</text><text y="64" font-size="15">Next.js / React Native</text><text y="91" font-size="15">PWA / UI systems</text>
  </g>
  <g transform="translate(727 132)">
    <text font-size="12" fill="#e94f2f">04 / BACKEND</text><text y="37" font-size="15" font-weight="700">Node.js / Bun</text><text y="64" font-size="15">WebSockets / SSE</text><text y="91" font-size="15">REST / real-time</text>
  </g>
  <g transform="translate(948 132)">
    <text font-size="12" fill="#e94f2f">05 / DATA + OPS</text><text y="37" font-size="15" font-weight="700">PostgreSQL / Redis</text><text y="64" font-size="15">Docker / CI/CD</text><text y="91" font-size="15">Azure / Prisma</text>
  </g>
</g>
<line x1="42" y1="260" x2="1158" y2="260" stroke="#111"/>
<text x="42" y="301" font-family="Courier New,monospace" font-size="12" fill="#e94f2f">SPECIALIZED / THE WEIRD STUFF I LOVE</text>
<g font-family="Impact,Arial Narrow,sans-serif" font-size="29" fill="#111">
  <text x="42" y="346">GAME ENGINES</text>
  <text x="276" y="346">REAL-TIME MULTIPLAYER</text>
  <text x="642" y="346">SHADERS</text>
  <text x="812" y="346">REVERSE ENGINEERING</text>
</g>

<rect x="42" y="397" width="1116" height="8" fill="#111"/>
<rect x="42" y="397" width="360" height="8" fill="#e94f2f">
 <animate attributeName="width" values="180;820;360" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>
